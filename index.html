<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Biotope – Ideology Life</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:monospace}
#ui{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#0f0}
</style>
</head>
<body>
<div id="ui">
YEAR:<span id="year">0</span> |
POP:<span id="pop">0</span> |
LEFT:<span id="left">0</span> |
RIGHT:<span id="right">0</span>
</div>

<script>
/* ================= 世界 ================= */
let organisms=[], foods=[], houses=[];
let time=0, year=0;
let uiYear, uiPop, uiLeft, uiRight;
let borderX;

/* ================= 家 ================= */
class House{
 constructor(x,y,side){
  this.pos=createVector(x,y);
  this.r=80;
  this.side=side;
 }
 show(){
  noFill();
  stroke(this.side==="L"?80:200,200,50,60);
  circle(this.pos.x,this.pos.y,this.r*2);
 }
}

/* ================= 生物 ================= */
class Organism{
 constructor(x,y,side){
  this.pos=createVector(x,y);
  this.vel=p5.Vector.random2D();
  this.acc=createVector();
  this.health=1;
  this.age=0;
  this.side=side;

  /* 👶 子供数制限（重要追加・要素削除なし） */
  this.childrenCount=0;
  this.maxChildren=4;

  this.dna={
   size:random(8,12),
   speed:side==="R"?random(1.8,2.6):random(1.2,2.0),
   sense:side==="R"?random(100,140):random(80,120),
   hue:side==="L"?120:20
  };
 }

 update(){
  this.age++;

  let baseLoss=this.side==="R"?0.00035:0.00025;
  this.health-=baseLoss;

  for(let h of houses){
   if(h.side===this.side){
    let d=p5.Vector.dist(this.pos,h.pos);
    if(d<h.r){
     this.health+=this.side==="L"?0.002:0.001;
    }
   }
  }

  this.health=constrain(this.health,0,1);

  this.move();
  this.vel.add(this.acc).limit(this.dna.speed);
  this.pos.add(this.vel);
  this.acc.mult(0);
  this.edges();
 }

 move(){
  let target=null;
  let best=1e9;

  for(let f of foods){
   let d=p5.Vector.dist(this.pos,f);
   if(d<best && d<this.dna.sense){
    best=d; target=f;
   }
  }

  if(target){
   let dir=p5.Vector.sub(target,this.pos).normalize();
   this.applyForce(dir.mult(0.25));
   if(best<this.dna.size){
    foods.splice(foods.indexOf(target),1);
    this.health+=0.6;
   }
  }else{
   if(this.side==="L"){
    let center=createVector(borderX/2,height/2);
    this.applyForce(p5.Vector.sub(center,this.pos).normalize().mult(0.05));
   }else{
    this.applyForce(p5.Vector.random2D().mult(0.15));
   }
  }
 }

 /* ================= 繁殖制御（重点修正） ================= */
 tryReproduce(other){
  if(this.side!==other.side) return null;
  if(this.health<0.75||other.health<0.75) return null;

  /* 👶 子供上限 */
  if(this.childrenCount>=this.maxChildren) return null;
  if(other.childrenCount>=other.maxChildren) return null;

  /* 🧬 交尾確率（低下） */
  let mateRate=this.side==="L"?0.025:0.012;
  if(random()>mateRate) return null;

  /* 👶 出産確率（さらに低下） */
  let birthRate=this.side==="L"?0.4:0.3;
  if(random()>birthRate) return null;

  this.health-=0.18;
  other.health-=0.18;

  this.childrenCount++;
  other.childrenCount++;

  let h=new House(
   (this.pos.x+other.pos.x)/2,
   (this.pos.y+other.pos.y)/2,
   this.side
  );
  houses.push(h);

  return new Organism(h.pos.x,h.pos.y,this.side);
 }

 applyForce(f){this.acc.add(f)}
 edges(){
  if(this.pos.x<0)this.pos.x=0;
  if(this.pos.x>width)this.pos.x=width;
  if(this.pos.y<0)this.pos.y=0;
  if(this.pos.y>height)this.pos.y=height;
 }
 dead(){return this.health<=0||this.age>2200}

 show(){
  fill(this.dna.hue,80,100,80);
  noStroke();
  circle(this.pos.x,this.pos.y,this.dna.size*2);
 }
}

/* ================= p5 ================= */
function setup(){
 createCanvas(windowWidth,windowHeight);
 colorMode(HSB,360,100,100,100);
 borderX=width/2;

 uiYear=document.getElementById("year");
 uiPop=document.getElementById("pop");
 uiLeft=document.getElementById("left");
 uiRight=document.getElementById("right");

 for(let i=0;i<200;i++) foods.push(createVector(random(width),random(height)));
 for(let i=0;i<10;i++) organisms.push(new Organism(random(borderX),random(height),"L"));
 for(let i=0;i<10;i++) organisms.push(new Organism(random(borderX,width),random(height),"R"));
}

function draw(){
 time++;
 if(time%60===0) year++;
 background(0,30,15);

 stroke(0,0,80,40);
 line(borderX,0,borderX,height);

 let left=0,right=0;

 if(random()<0.35) foods.push(createVector(random(borderX),random(height)));
 if(random()<0.2) foods.push(createVector(random(borderX,width),random(height)));

 noStroke();
 fill(100,255,100,120);
 for(let f of foods) circle(f.x,f.y,4);

 for(let h of houses) h.show();

 for(let i=organisms.length-1;i>=0;i--){
  let o=organisms[i];
  o.update(); o.show();
  o.side==="L"?left++:right++;

  for(let j=i-1;j>=0;j--){
   let other=organisms[j];
   if(p5.Vector.dist(o.pos,other.pos)<o.dna.size*2){
    let child=o.tryReproduce(other);
    if(child) organisms.push(child);
   }
  }

  if(o.dead()) organisms.splice(i,1);
 }

 uiYear.textContent=year;
 uiPop.textContent=organisms.length;
 uiLeft.textContent=left;
 uiRight.textContent=right;
}

function windowResized(){
 resizeCanvas(windowWidth,windowHeight);
 borderX=width/2;
}
</script>
</body>
</html>
