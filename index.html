<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ビオトープ × 国境・思想シミュレーション</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;padding:0;
  width:100vw;height:100vh;
  background:#182018;color:#eee;
  overflow:hidden;
  font-family:"Segoe UI","Arial",sans-serif;
}
#main{width:100vw;height:100vh;position:fixed;display:flex;flex-direction:column;}
#biotope{flex:1;background:#111;cursor:pointer;}
#ctrls{
  background:rgba(14,17,12,.93);
  padding:.4em;display:flex;gap:1em;align-items:center;
}
#command{
  font-size:1.1em;width:320px;
  background:#1c2935;border:1.6px solid #469b5a;
  color:#eef;border-radius:6px;
}
#legend{font-size:.9em;color:#beb}
#status-pane{
  position:fixed;right:.6em;bottom:.6em;
  background:rgba(20,30,20,.9);
  padding:.6em;border-radius:8px;
  line-height:1.6;font-size:1em;
}
</style>
</head>
<body>
<div id="main">
<canvas id="biotope"></canvas>
<div id="ctrls">
<span id="legend">
🟠市民(prey) 🔴捕食者 🟢食料<br>
⬅ 共産主義｜資本主義 ➡<br>
<code>add prey</code> <code>add predator</code> <code>add food</code> <code>war</code>
</span>
<input id="command" placeholder="コマンド入力…">
</div>
<div id="status-pane">
共産主義人口: <span id="c-left">0</span><br>
資本主義人口: <span id="c-right">0</span><br>
戦争状態: <span id="war-state">平和</span>
</div>
</div>

<script>
/* ===== 既存ビオトープ（未削除） ===== */
let W=innerWidth,H=innerHeight;
const PREY_RADIUS=13,FOOD_RADIUS=4.5,PRED_RADIUS=19;
const PREY_EN_MOVE=0.06,PRED_EN_MOVE=0.09;
const PREY_EN_FOOD=10,PREY_EN_MAX=32;
const PREY_EN_REP=18,PREY_REP_PROB=0.12;
const PREY_LIFE=580;
const PRED_EN_PREY=14,PRED_EN_MAX=44;
const PRED_EN_REP=30,PRED_REP_PROB=0.025;
const PRED_LIFE=800;

function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function randXY(){return[Math.random()*W,Math.random()*H]}

class Food{constructor(x,y){this.x=x;this.y=y}}
class Prey{
  constructor(x,y,en=16){this.x=x;this.y=y;this.en=en;this.age=0}
  move(){
    let t=Math.random()*6.28,s=Math.random()*2;
    this.x=clamp(this.x+Math.cos(t)*s,0,W);
    this.y=clamp(this.y+Math.sin(t)*s,0,H);
    this.en-=PREY_EN_MOVE;this.age++;
  }
  eat(fs){
    for(let i=fs.length-1;i>=0;i--){
      if(dist(this.x,this.y,fs[i].x,fs[i].y)<PREY_RADIUS+FOOD_RADIUS){
        this.en=Math.min(PREY_EN_MAX,this.en+PREY_EN_FOOD);
        fs.splice(i,1);break;
      }
    }
  }
  canReproduce(){return this.en>PREY_EN_REP&&Math.random()<PREY_REP_PROB}
  reproduce(){
    this.en>>=1;
    return new Prey(this.x+Math.random()*20-10,this.y+Math.random()*20-10,this.en)
  }
  isDead(){return this.en<=0||this.age>PREY_LIFE}
}
class Predator{
  constructor(x,y,en=18){this.x=x;this.y=y;this.en=en;this.age=0}
  move(ps){
    let t=Math.random()*6.28;
    if(ps.length){
      let p=ps[Math.random()*ps.length|0];
      t=Math.atan2(p.y-this.y,p.x-this.x);
    }
    this.x=clamp(this.x+Math.cos(t)*2,0,W);
    this.y=clamp(this.y+Math.sin(t)*2,0,H);
    this.en-=PRED_EN_MOVE;this.age++;
  }
  eat(ps){
    for(let i=ps.length-1;i>=0;i--){
      if(dist(this.x,this.y,ps[i].x,ps[i].y)<PRED_RADIUS+PREY_RADIUS){
        this.en=Math.min(PRED_EN_MAX,this.en+PRED_EN_PREY);
        ps.splice(i,1);break;
      }
    }
  }
  canReproduce(){return this.en>PRED_EN_REP&&Math.random()<PRED_REP_PROB}
  reproduce(){this.en>>=1;return new Predator(this.x,this.y,this.en)}
  isDead(){return this.en<=0||this.age>PRED_LIFE}
}

let preys=[],preds=[],foods=[];
for(let i=0;i<20;i++){let[x,y]=randXY();preys.push(new Prey(x,y))}
for(let i=0;i<3;i++){let[x,y]=randXY();preds.push(new Predator(x,y))}
for(let i=0;i<40;i++){let[x,y]=randXY();foods.push(new Food(x,y))}

/* ===== 国境・思想シミュレーション（追加） ===== */
let borderX=()=>W/2;
let war=false;
let crossCount=0;

function startWar(){war=true;crossCount=0}
function endWar(winner){
  war=false;
  if(winner==="left") borderShift(-80);
  if(winner==="right") borderShift(80);
}
function borderShift(dx){
  let bx=borderX()+dx;
  borderX=()=>bx;
}

/* ===== 描画 ===== */
const cvs=document.getElementById("biotope");
const ctx=cvs.getContext("2d");
function resize(){W=innerWidth;H=innerHeight;cvs.width=W;cvs.height=H}
addEventListener("resize",resize);resize();

function draw(){
  ctx.clearRect(0,0,W,H);

  if(!war){
    ctx.strokeStyle="#aaa";ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.moveTo(borderX(),0);ctx.lineTo(borderX(),H);ctx.stroke();
    ctx.setLineDash([]);
  }

  for(const f of foods){
    ctx.fillStyle="#38f457";
    ctx.beginPath();ctx.arc(f.x,f.y,FOOD_RADIUS,0,6.28);ctx.fill();
  }

  for(const p of preys){
    ctx.fillStyle=p.x<borderX()?"#ff9933":"#3399ff";
    ctx.beginPath();ctx.arc(p.x,p.y,PREY_RADIUS,0,6.28);ctx.fill();
  }

  for(const pr of preds){
    ctx.strokeStyle="#ff5555";
    ctx.beginPath();ctx.arc(pr.x,pr.y,PRED_RADIUS,0,6.28);ctx.stroke();
  }
}

/* ===== 更新 ===== */
function update(){
  let babies=[];
  for(const p of preys){
    let prev=p.x<borderX();
    p.move();p.eat(foods);
    if(prev!==p.x<borderX()) crossCount++;
    if(p.canReproduce()) babies.push(p.reproduce());
  }
  preys=preys.filter(p=>!p.isDead()).concat(babies);

  let pb=[];
  for(const pr of preds){
    pr.move(preys);pr.eat(preys);
    if(pr.canReproduce()) pb.push(pr.reproduce());
  }
  preds=preds.filter(p=>!p.isDead()).concat(pb);

  if(!war && crossCount>20) startWar();

  let L=preys.filter(p=>p.x<borderX()).length;
  let R=preys.length-L;
  if(war && (L<5||R<5)) endWar(L>R?"left":"right");

  document.getElementById("c-left").textContent=L;
  document.getElementById("c-right").textContent=R;
  document.getElementById("war-state").textContent=war?"戦争中":"平和";
}

/* ===== コマンド ===== */
command.onkeydown=e=>{
  if(e.key==="Enter"){
    let v=command.value;
    if(v==="war") startWar();
    command.value="";
  }
};

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
